name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*", "!v1.*"] # v1.x 为 Node/SEA 维护线，不触发 Rust 桌面发布

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ""
          - os: macos-latest
            target: "--target universal-apple-darwin" # 双架构（Apple Silicon + Intel）
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend deps
        run: npm ci

      - name: Regression tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build (tauri)
        run: npx tauri build ${{ matrix.target }}

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: KimiMonitor-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: KimiMonitor-macos
          if-no-files-found: error
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: KimiMonitor-*
          path: release-assets
          merge-multiple: true
      - name: Prepare Rust desktop release draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "${{ github.ref_name }} — Rust/Tauri 桌面版"
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.dmg
